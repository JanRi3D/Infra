---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/config-schema.json
sonarr:
  series:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default # used for series with Series Type = Anime
    quality_definition:
      type: series # TRaSH: keep standard sizes when anime shares the instance
    quality_profiles:
      - trash_id: dca7e5e9e99c703bcbdaaa471dd40e98 # [German] HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: 3b0fa37fddaaefc931b75f2889d4b4f5 # [German] UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: 6fe5937e1dcc2269e23b49eb46dfe6d6 # [German] Anime HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - # Remove if every Jellyfin client can play Dolby Vision
          trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
          assign_scores_to:
            - trash_id: 3b0fa37fddaaefc931b75f2889d4b4f5 # [German] UHD Bluray + WEB
    custom_formats:
      - # Optional CFs from "Unwanted Formats German" (not on by default)
        trash_ids:
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - trash_id: dca7e5e9e99c703bcbdaaa471dd40e98 # [German] HD Bluray + WEB
          - trash_id: 3b0fa37fddaaefc931b75f2889d4b4f5 # [German] UHD Bluray + WEB
          - trash_id: 6fe5937e1dcc2269e23b49eb46dfe6d6 # [German] Anime HD Bluray + WEB
            score: -35000 # no german-anime score in the guide; match the German profiles

radarr:
  movies:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb
    quality_definition:
      type: movie # TRaSH: keep standard sizes when anime shares the instance
    quality_profiles:
      - trash_id: 2b90e905c99490edc7c7a5787443748b # [German] HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: 27cc3d153c0a799fd139ef1ff4c4cc42 # [German] UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: bf3cc2e99ad9a804a9b0d0e538e1fbba # [German] Anime HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - # Remove if every Jellyfin client can play Dolby Vision
          trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
          assign_scores_to:
            - trash_id: 27cc3d153c0a799fd139ef1ff4c4cc42 # [German] UHD Bluray + WEB
    custom_formats:
      - # Optional CFs from "Unwanted Formats German" (not on by default)
        trash_ids:
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
        assign_scores_to:
          - trash_id: 2b90e905c99490edc7c7a5787443748b # [German] HD Bluray + WEB
          - trash_id: 27cc3d153c0a799fd139ef1ff4c4cc42 # [German] UHD Bluray + WEB
          - trash_id: bf3cc2e99ad9a804a9b0d0e538e1fbba # [German] Anime HD Bluray + WEB
            score: -35000 # no german-anime score in the guide; match the German profiles
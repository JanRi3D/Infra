---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  interval: 1h
  # Must outlast CrashLoopBackOff (5m): on timeout, cleanupOnFail deletes the CRDs this upgrade created
  timeout: 10m
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true